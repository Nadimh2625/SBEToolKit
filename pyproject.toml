[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbetoolkit"
version = "0.1.0"
description = "Switchback experiment toolkit: power, randomization, CUPED, sequential testing, and marketplace interference diagnostics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SBEToolKit" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
sbetoolkit-figure = "sbetoolkit.cli:main"

[tool.setuptools.packages.find]
include = ["sbetoolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
